# ================================================================
# Business Daily Tools -- AUTOGENERIERT von ce_rapotheke/scripts/
# sync-docs-to-bdt-app.mjs (npm run generate:docsite im Hauptrepo),
# NICHT von Hand bearbeiten.
#
# Quelle: ce_rapotheke/docs-user/ (docs/roadmap-doku.md §7). Die
# Navigation kommt aus derselben Logik wie die In-App-Hilfe
# (extension/js/helptools.js#buildNavGroups + Store.GROUPS +
# TileCatalog, AP-DOC4/AP-DOC5) -- kein zweiter, von Hand gepflegter
# Navigations-Code.
# ================================================================

site_name: BDT – Business Daily Tools
site_description: Anwenderdokumentation für Business Daily Tools (Brandeis Consulting)
site_url: https://mdjoerg.github.io/bdt-app/
repo_url: https://github.com/MDJoerg/bdt-app
repo_name: bdt-app
edit_uri: ''
docs_dir: docs
theme:
  name: material
  language: de
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Dunkles Farbschema
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Helles Farbschema
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
plugins:
  - search
extra:
  version:
    provider: mike
nav:
  - Start: index.md
  - FAQ: faq.md
  - Einstieg:
      - Grundkonzepte: einstieg/konzept.md
      - Erste Schritte: einstieg/erste-schritte.md
      - Tipps: einstieg/tipps.md
  - Kacheln:
